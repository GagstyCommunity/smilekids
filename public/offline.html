<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Denta.Health</title>
  <meta name="theme-color" content="#0ea5b7" />
  <style>
    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #ecfeff 0%, #ffffff 50%, #f0fdfa 100%); color: #0f172a;
      display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px; box-shadow: 0 10px 30px -10px rgba(14,165,183,0.2); }
    .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg,#0ea5b7,#34d399); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 22px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { color: #475569; margin: 0 0 20px; font-size: 14px; line-height: 1.5; }
    button { background: linear-gradient(135deg,#0ea5b7,#34d399); color: #fff; border: 0; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">D</div>
    <h1>You're offline</h1>
    <p>Denta.Health needs an internet connection for AI wellness guidance. Your habits and streaks will sync when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
